# Workflow de GitHub Actions: compila el sitio con Astro y lo publica en
# GitHub Pages cada vez que hay un push a la rama principal (main). No hace
# falta correr ningún comando a mano: GitHub lo ejecuta automáticamente.
name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  # Permite lanzar el despliegue manualmente desde la pestaña "Actions".
  workflow_dispatch:

# Permisos mínimos que necesita el workflow para publicar en Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Evita que dos despliegues se pisen si hay pushes seguidos.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v5

      - name: Instalar, compilar y subir el sitio como artefacto de Pages
        # withastro/action instala, compila con Astro Y sube el artefacto de
        # Pages internamente. NO agregar aquí un paso aparte con
        # actions/upload-pages-artifact: crea un artefacto con el mismo
        # nombre y el workflow falla con "409 Conflict".
        uses: withastro/action@v6
        with:
          # Astro 7 requiere Node >=22.12.0.
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
